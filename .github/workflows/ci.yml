name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @izla/db generate

      # Xavfsizlik: yangi CRITICAL zaiflik CI'ni bloklaydi (mavjud build-vaqti
      # high'lar override bilan monitoring ostida). Haftalik Dependabot ham bor.
      - name: Security audit (prod deps)
        run: pnpm audit --prod --audit-level critical

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (API)
        run: pnpm --filter @izla/api test

      - name: Unit tests (web — utils, i18n parity, komponentlar)
        run: pnpm --filter @izla/web test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint web (0 error majburiy)
        run: pnpm --filter @izla/web lint
